application:
  subdomain: upvote-rss
  multi_instance: false
  # 应用本身没有账号体系，RSS 阅读器需要直接访问订阅地址；
  # 因此整个站点公开访问。不要在其他地方复用同一套 Reddit 凭据。
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://upvote-rss:80/
services:
  upvote-rss:
    # upstream: ghcr.io/johnwarne/upvote-rss:v1.8.2
    image: ghcr.dockerproxy.net/johnwarne/upvote-rss:v1.8.2
    environment:
      - TZ=Asia/Shanghai
      - MAX_EXECUTION_TIME=300
      - USER_ID=1000
      - GROUP_ID=1000
      - REDDIT_USER={{ .U.reddit_user }}
      - REDDIT_CLIENT_ID={{ .U.reddit_client_id }}
      - REDDIT_CLIENT_SECRET={{ .U.reddit_client_secret }}
      - OLLAMA_URL={{ .U.ollama_url }}
      - OLLAMA_MODEL={{ .U.ollama_model }}
      - OPENAI_API_KEY={{ .U.openai_api_key }}
      - OPENAI_API_MODEL={{ .U.openai_api_model }}
    binds:
      # 缓存里可能有解析好的正文和付费生成的 AI 摘要，放 var 持久化
      - /lzcapp/var/cache:/app/cache
      - /lzcapp/var/logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:80 || exit 1
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
usage: |
  Upvote RSS 把社交聚合站点的高热度帖子变成 RSS 订阅源：打开应用后选择平台
  （Reddit / Hacker News / Lemmy / Lobsters / PieFed / Mbin / GitHub）、社区和
  过滤方式，预览结果后点击 Copy RSS URL，把地址粘进任意 RSS 阅读器即可。

  过滤方式：
    - Score：低于指定分数的帖子不输出
    - Threshold：与近一个月热门帖的平均分比较，按百分比过滤
    - Posts Per Day：按社区近期数据反推分数线，让每天大致输出指定条数

  还可以勾选附文章正文、AI 摘要、热门评论、过滤置顶评论、过滤旧帖和 NSFW。

  Reddit 说明：
    - Reddit 需要你自己的 Reddit API 应用凭据（3 项部署参数都要填）。
    - 未填写时 Reddit 选项不可用，其它平台不受影响。
    - 在 reddit.com/prefs/apps 创建 web app 即可获得 Client ID 和 Secret。

  AI 摘要：
    - 可填 Ollama 地址/模型，或 OpenAI API Key/模型；留空则不启用。
    - 启用后生成订阅源会明显变慢，可能触发阅读器超时，建议先用少量帖子测试。

  注意事项：
    - 应用没有登录账号，订阅地址本身就是访问凭据；这个站点是公开的，
      知道地址的人都能生成订阅源。不要把它当成私密服务，也不要在公开场合
      传播自己的应用地址。
    - 数据（缓存正文、AI 摘要、日志）保存在本地持久目录，卸载应用默认删除。
    - Reddit API 有速率限制，建议单条源配合 Posts Per Day 过滤，不要高频刷新。

  本包未在懒猫实机安装验证，首次部署后请先打开页面生成一条 Hacker News 源测试。

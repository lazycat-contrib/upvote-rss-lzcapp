version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: upvote-rss

build:
  toolchains: []
  run_buildscript: false

images:
  # 上游只有 v1.0.0 ~ v1.8.2 这类 v 前缀三段 SemVer 标签，外加 latest。
  # tag_regex 只取版本标签，version_regex 去掉 v 前缀映射为包版本。
  - id: upvote-rss
    target: service
    service: upvote-rss
    source: ghcr.io/johnwarne/upvote-rss
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    # 只发布喵喵（私有）商店，不走官方审核
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Upvote RSS
    summary: "把 Reddit、Hacker News、Lemmy、Lobsters 等热门帖子变成 RSS 订阅源"

params:
  - id: reddit_user
    type: string
    name: Reddit Username
    description: "Reddit account used for API requests. Leave empty to disable Reddit; all other platforms work without it."
    optional: true
    default_value: ""

  - id: reddit_client_id
    type: string
    name: Reddit Client ID
    description: "Client ID of your Reddit web app (reddit.com/prefs/apps). Required together with the client secret for Reddit feeds."
    optional: true
    default_value: ""

  - id: reddit_client_secret
    type: secret
    name: Reddit Client Secret
    description: "Client secret of your Reddit web app. Required together with the client ID for Reddit feeds."
    optional: true
    default_value: ""

  - id: ollama_url
    type: string
    name: Ollama URL
    description: "URL of an Ollama instance for AI article summaries, for example http://192.168.1.10:11434. Leave empty to disable Ollama."
    optional: true
    default_value: ""

  - id: ollama_model
    type: string
    name: Ollama Model
    description: "Ollama model used for article summaries, for example qwen2.5:7b. Only used when an Ollama URL is set."
    optional: true
    default_value: ""

  - id: openai_api_key
    type: secret
    name: OpenAI API Key
    description: "OpenAI API key for AI article summaries. Leave empty to disable OpenAI."
    optional: true
    default_value: ""

  - id: openai_api_model
    type: string
    name: OpenAI API Model
    description: "OpenAI model used for article summaries."
    optional: true
    default_value: "gpt-4o-mini"


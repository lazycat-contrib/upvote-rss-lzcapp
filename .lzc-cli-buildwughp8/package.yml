name: Upvote RSS
description: >-
  Generate rich RSS feeds from Reddit, Hacker News, Lemmy, Lobsters, PieFed,
  Mbin and GitHub
min_os_version: 1.5.0
homepage: https://github.com/johnwarne/upvote-rss
author: johnwarne
license: MIT
permissions:
  required:
    - net.internet
locales:
  zh:
    name: Upvote RSS
    description: >-
      从 Reddit、Hacker News、Lemmy、Lobsters、PieFed、Mbin 和 GitHub 生成高质量 RSS
      源：按热度或每日条数过滤，可附正文、AI 摘要与热门评论
  en:
    name: Upvote RSS
